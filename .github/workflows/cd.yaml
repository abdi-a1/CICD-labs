name: Automating image push to Docker Hub

on: [push]

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
    
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
    
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
    
        - name: Build and Publish
          run: |
            registry="abdi1n0"
            sha=$(git rev-parse --short HEAD)
            primary_tag="${registry}/cicd-test:${sha}"

            docker build -t $primary_tag -f Dockerfile .
            docker push $primary_tag

            current_branch=$(git rev-parse --abbrev-ref HEAD)
            if [ "$current_branch" = "main" ]; then
                retention_tag="${registry}/cicd-test:rc-${sha}"
                docker tag $primary_tag $retention_tag
                docker push $retention_tag
            else
                echo "Not on main, skipping rc tag"
            fi